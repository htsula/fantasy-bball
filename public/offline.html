<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline - Fantasy Hoops</title>
    <style>
      :root { color-scheme: light; }
      body { background: #fff; color: #171717; font-family: system-ui, sans-serif; margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 1.5rem; text-align: center; }
      main { max-width: 22rem; }
      h1 { font-size: 1.4rem; margin: 0 0 0.5rem; }
      p { color: GrayText; line-height: 1.5; }
      button { font: inherit; padding: 0.7rem 1.4rem; border-radius: 0.6rem; border: 0; background: #ea580c; color: #fff; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Fantasy Hoops needs a connection so you always see live scores and rosters. Reconnect and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
